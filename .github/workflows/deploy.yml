name: Deploy pe AWS EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: /home/ubuntu/chestionar-kabbalah
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pregătesc cheia SSH
        env:
          # Secretul trebuie să conțină cheia PRIVATĂ encodată base64 (un singur rând).
          # Pe Windows: [Convert]::ToBase64String([IO.File]::ReadAllBytes("kabbalah-ec2-deploy"))
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          if [ -z "$EC2_SSH_KEY_B64" ]; then
            echo "Secretul EC2_SSH_KEY e gol."
            exit 1
          fi
          echo "$EC2_SSH_KEY_B64" | tr -d '\r\n ' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sincronizez fișierele pe instanță
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 \
            "${EC2_USER}@${EC2_HOST}" "mkdir -p '${APP_DIR}'"
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '**/node_modules/' \
            --exclude 'api/dist/' \
            --exclude 'frontend/dist/' \
            -e "ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30" \
            ./ "${EC2_USER}@${EC2_HOST}:${APP_DIR}/"

      - name: Rebuild, migrări (initDb) și restart
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            "${EC2_USER}@${EC2_HOST}" \
            "chmod +x '${APP_DIR}/deploy/update.sh' && bash '${APP_DIR}/deploy/update.sh'"
